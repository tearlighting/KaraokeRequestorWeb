map "$request_method:$uri" $yukari_lan_api_allowed {
    default 0;
    "POST:/api/v1/user/session" 1;
    "GET:/api/v1/user/profile" 1;
    "PUT:/api/v1/user/profile" 1;
    "GET:/api/v1/user/participants" 1;
    "GET:/api/v1/user/reservations" 1;
    "GET:/api/v1/capabilities" 1;
    "GET:/api/v1/search" 1;
    "GET:/api/v1/queue" 1;
    "GET:/api/v1/playback" 1;
    "GET:/api/v1/playback/agent" 1;
    "POST:/api/v1/user/player/control" 1;
    "GET:/api/v1/danmaku/status" 1;
    "POST:/api/v1/danmaku" 1;
    "GET:/api/v1/user/entry-probe" 1;
    "POST:/api/v1/requests" 1;
    "POST:/api/v1/requests/intent" 1;
    "POST:/api/v1/requests/result" 1;

    "GET:/api/v1/admin/session" 1;
    "POST:/api/v1/admin/session" 1;
    "DELETE:/api/v1/admin/session" 1;
    "GET:/api/v1/admin/queue" 1;
    "GET:/api/v1/admin/status" 1;
    "POST:/api/v1/admin/queue/reorder" 1;
    "GET:/api/v1/admin/player-agent" 1;
    "GET:/api/v1/admin/player-agent/mpv" 1;
    "POST:/api/v1/admin/player-agent/mpv-control" 1;
    "POST:/api/v1/admin/player-agent/launcher" 1;
    "GET:/api/v1/admin/participants" 1;
    "~^PUT:/api/v1/admin/participants/[0-9a-f-]{36}$" 1;
    "POST:/api/v1/admin/player-agent/test" 1;
    "POST:/api/v1/admin/player-agent/control" 1;
    "POST:/api/v1/admin/player-agent/autoplay" 1;
    "~^POST:/api/v1/admin/queue/[0-9]+/media-check$" 1;
    "~^GET:/api/v1/admin/queue/[0-9]+/media-check/[0-9a-f-]{36}$" 1;
    "GET:/api/v1/admin/connection-entry" 1;
    "PUT:/api/v1/admin/connection-entry" 1;
    "GET:/api/v1/admin/gateway/status" 1;
    "GET:/api/v1/admin/playback/history" 1;
    "GET:/api/v1/admin/playback/recoverable" 1;
    "~^POST:/api/v1/admin/playback/tasks/[0-9a-f-]{36}/recheck$" 1;
    "~^POST:/api/v1/admin/playback/tasks/[0-9a-f-]{36}/confirm-inactive$" 1;
    "~^POST:/api/v1/admin/playback/tasks/[0-9a-f-]{36}/retry$" 1;
    "~^POST:/api/v1/admin/playback/tasks/[0-9a-f-]{36}/handled$" 1;
    "PUT:/api/v1/admin/danmaku/settings" 1;
    "GET:/api/v1/admin/danmaku/settings" 1;
    "POST:/api/v1/admin/danmaku/clear" 1;
    "~^DELETE:/api/v1/admin/requests/[0-9]+$" 1;
    "~^PUT:/api/v1/admin/requests/[0-9]+/comment$" 1;
    "~^POST:/api/v1/admin/requests/[0-9]+/move$" 1;
    "GET:/api/v1/settings" 1;
    "PUT:/api/v1/settings" 1;
    "POST:/api/v1/playback/control" 1;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    location = / { return 302 /user/; }
    location = /user { return 308 /user/; }
    location = /admin { return 308 /admin/; }

    location ^~ /user/assets/ { try_files $uri =404; }
    location ^~ /admin/assets/ { try_files $uri =404; }
    location = /user/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /user/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /admin/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* ^/(?:user|admin)/.*\.[^/]+$ { try_files $uri =404; }
    location /user/ { try_files $uri $uri/ /user/index.html; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }

    location ^~ /api/v1/ {
        if ($yukari_lan_api_allowed = 0) { return 404; }
        proxy_pass http://api-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host api-server:3000;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Yukari-User-Lan-Proxy 1;
        proxy_set_header X-Yukari-Admin-Lan-Proxy 1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
