# Legacy UI remains available locally; build sources and runtime files are not web assets.
<LocationMatch "^/(?:apps|packages|docker|docs|runtime|test_race|fortest|\.git)(?:/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(?:\.(?:db|sqlite3?)(?:-(?:wal|shm|journal))?|\.(?:ini|env|log|ppk|pem|key))$">
    Require all denied
</FilesMatch>

# Production React entry points share Apache with Legacy PHP without changing old URLs.
RedirectMatch 308 ^/admin$ /admin/
RedirectMatch 308 ^/user$ /user/
Alias /app/ /var/www/ui/
Alias /user/ /var/www/ui/user/
Alias /admin/ /var/www/ui/admin/
<Directory "/var/www/ui">
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>
<Directory "/var/www/ui/user">
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/user/assets(?:/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ - [R=404,END]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_URI} \.[^/]+$ [NC]
    RewriteRule ^ - [R=404,END]
    FallbackResource /user/index.html
</Directory>
<Directory "/var/www/ui/admin">
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/admin/assets(?:/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ - [R=404,END]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_URI} \.[^/]+$ [NC]
    RewriteRule ^ - [R=404,END]
    FallbackResource /admin/index.html
</Directory>

# Disable unmigrated PHP business pages before their includes can initialize
# request.db, favorites, notices or other SQLite databases. Search and the
# authenticated Fastify bridge are explicitly allowlisted in this guard.
<Directory "/var/www/html">
    php_admin_value auto_prepend_file "/var/www/html/mysql-mode-guard.php"
</Directory>

# Same-origin React API boundary. Fastify still enforces session role, Origin,
# CSRF marker and per-operation authorization; Apache is not an auth boundary.
ProxyPass        "/api/v1/" "http://api-server:3000/api/v1/" connectiontimeout=2 timeout=60
ProxyPassReverse "/api/v1/" "http://api-server:3000/api/v1/"
<LocationMatch "^/api/v1/">
    RequestHeader unset Authorization
    Require all granted
</LocationMatch>
