# Legacy UI remains available locally; build sources and runtime files are not web assets.
<LocationMatch "^/(?:apps|packages|docker|docs|runtime|test_race|fortest|\.git)(?:/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(?:\.(?:db|sqlite3?)(?:-(?:wal|shm|journal))?|\.(?:ini|env|log|ppk|pem|key))$">
    Require all denied
</FilesMatch>

# Limited same-origin adapters: public health and capability-authorized read-only queue.
# Never forward Basic credentials. Health/queue tickets strip cookies; the exact admin reorder path forwards only the Node session cookie.
ProxyPassMatch "^/(api/v1/(?:meta/health|legacy/queue))$" "http://api-server:3000/$1" connectiontimeout=2 timeout=5
ProxyPass "/api/v1/admin/queue/reorder" "http://api-server:3000/api/v1/admin/queue/reorder"
<LocationMatch "^/api/v1/(?:meta/health|legacy/queue)$">
    RequestHeader unset Authorization
    RequestHeader unset Cookie
</LocationMatch>
<LocationMatch "^/api/v1/admin/queue/reorder$">
    RequestHeader unset Authorization
</LocationMatch>
<LocationMatch "^/api/v1/">
    Require all denied
</LocationMatch>
<LocationMatch "^/api/v1/(?:meta/health|legacy/queue|admin/queue/reorder)$">
    Require all granted
</LocationMatch>
<LocationMatch "^/api/v1/?$">
    Require all denied
</LocationMatch>
