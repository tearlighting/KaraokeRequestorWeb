services:
  bridge-init:
    container_name: yukari-bridge-init
    image: node:24-alpine
    command: ["node", "/init-bridge.mjs"]
    volumes:
      - ./init-bridge.mjs:/init-bridge.mjs:ro
      - legacy_bridge:/run/yukari
    restart: "no"
  mysql:
    container_name: yukari-mysql
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: yukari
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yukari-local-root-only}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - yukari_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  mysql-init:
    # Runs on Compose startup but only initializes an empty database. Existing
    # account passwords and seeded settings are never reset or re-imported.
    container_name: yukari-mysql-init
    build:
      context: ..
      dockerfile: apps/api-server/Dockerfile
    command: ["node", "dist/mysql-bootstrap.js"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: yukari
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yukari-local-root-only}
      MYSQL_APP_PASSWORD: ${MYSQL_PASSWORD:-yukari-local-app-only}
      MYSQL_VIEWER_PASSWORD: ${MYSQL_VIEWER_PASSWORD:-yukari-local-viewer-only}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-yukari-local-migrator-only}
      MYSQL_LEGACY_SETTINGS_FILE: /run/legacy-settings/config.ini
    volumes:
      - type: bind
        source: ../legacy/php/config.ini
        target: /run/legacy-settings/config.ini
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  mysql-migrate:
    # Ordered, checksummed, non-root incremental migrations. Failure gates API startup.
    container_name: yukari-mysql-migrate
    build:
      context: ..
      dockerfile: apps/api-server/Dockerfile
    command: ["node", "dist/migrate-mysql.js"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: yukari
      MYSQL_USER: yukari_migrator
      MYSQL_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-yukari-local-migrator-only}
    depends_on:
      mysql:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
    restart: "no"
  web:
    container_name: yukari-web-php
    # Serves Legacy PHP plus the production-built user-web (/user/) and admin-web (/admin/).
    # Fastify runs as the api-server service below; Vite is only for separate UI development.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: php-web
    ports:
      - "127.0.0.1:8180:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # PHP sources are baked into the image. Only the active auth configuration
      # and the independent, read-only YukaLister search index are mounted.
      - type: bind
        source: ../legacy/php/config.ini
        target: /var/www/html/config.ini
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ../legacy/php/List.sqlite3
        target: /var/www/html/List.sqlite3
        read_only: true
        bind: { create_host_path: false }
      - yukari_queue_owner:/var/www/html/runtime/queue-owner
      - ../gateway/apache-private.conf:/etc/apache2/conf-enabled/zz-yukari-private.conf:ro
      - legacy_bridge:/run/yukari:ro
    depends_on:
      bridge-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Tokyo
      YUKARI_MONOREPO: "1"
      YUKARI_NODE_REQUESTS: "1"
      YUKARI_MYSQL_MODE: "1"
      YUKARI_EVERYTHING_HOST: "host.docker.internal"
      YUKARI_LISTER_DB_PATH: /var/www/html/List.sqlite3
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/app/') === false ? 1 : 0);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  api-server:
    container_name: yukari-api-server
    group_add: ["33"]
    build:
      context: ..
      dockerfile: apps/api-server/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Asia/Tokyo
      USER_ORIGINS: "http://127.0.0.1:8180,http://localhost:8180,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:${USER_LAN_PORT:-8181},http://localhost:${USER_LAN_PORT:-8181}"
      ADMIN_ORIGINS: "http://127.0.0.1:8180,http://localhost:8180,http://127.0.0.1:5174,http://localhost:5174"
      LEGACY_QUEUE_ORIGINS: "http://127.0.0.1:8180,http://localhost:8180"
      LEGACY_PHP_URL: http://web
      LEGACY_BRIDGE_TOKEN_FILE: /run/yukari/bridge-token
      NODE_QUEUE_OWNER_ROOT: /run/queue-owner
      PLAYER_AGENT_TOKEN_FILE: /run/player-agent-token/token
      PLAYER_AGENT_STATE_PATH: /run/player-agent-state/state.json
      YUKARI_NODE_AUTOPLAY: "1"
      YUKARI_AGENT_SEARCH: "0"
      USER_LAN_PORT: ${USER_LAN_PORT:-8181}
      ADMIN_LAN_PORT: ${USER_LAN_PORT:-8181}
      CLOUDFLARE_TUNNEL_CONFIGURED: ${CLOUDFLARE_TUNNEL_TOKEN:+1}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: yukari
      MYSQL_USER: yukari_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yukari-local-app-only}
    volumes:
      - legacy_bridge:/run/yukari:ro
      - ../.local/player-agent-token:/run/player-agent-token/token:ro
      - player_agent_state:/run/player-agent-state
      # Separate shared owner fence only; no SQLite database/config mount.
      - yukari_queue_owner:/run/queue-owner
    depends_on:
      mysql:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      mysql-migrate:
        condition: service_completed_successfully
      bridge-init:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  user-lan:
    container_name: yukari-user-lan
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gateway-lan
    ports:
      - "${USER_LAN_PORT:-8181}:8080"
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/user/"]
      interval: 15s
      timeout: 5s
      retries: 3
  gateway-tunnel:
    container_name: yukari-gateway-tunnel
    # Always build/update the User-only origin with ordinary Compose runs.
    # It is internal-only: without the optional cloudflared connector there is
    # no public path to this service.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gateway-tunnel
    expose:
      - "8080"
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/user/"]
      interval: 15s
      timeout: 5s
      retries: 3
  cloudflared:
    container_name: yukari-cloudflared
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # Only this profile-controlled connector can make the internal origin
    # reachable from the Internet. Ordinary `docker compose up` excludes it;
    # Compose leaves an existing profiled container's running/stopped state
    # untouched when that profile is not selected.
    # The official client reads TUNNEL_TOKEN directly from its environment.
    command: ["tunnel", "--metrics", "0.0.0.0:2000", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    expose:
      - "2000"
    depends_on:
      gateway-tunnel:
        condition: service_healthy
    restart: unless-stopped
  user-web-dev:
    container_name: yukari-user-web-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: user-web-build
    command: ["npm", "--prefix", "apps/user-web", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://api-server:3000
      VITE_USE_POLLING: "1"
    volumes:
      - ../apps/user-web/src:/repo/apps/user-web/src
      - ../apps/user-web/public:/repo/apps/user-web/public:ro
      - ../apps/user-web/index.html:/repo/apps/user-web/index.html:ro
      - ../apps/user-web/vite.config.ts:/repo/apps/user-web/vite.config.ts:ro
      - ../packages/contracts:/repo/packages/contracts
      - ../packages/web-foundation:/repo/packages/web-foundation
      - ../packages/theme:/repo/packages/theme
      - ../packages/language:/repo/packages/language
      - ../packages/reactiveStore:/repo/packages/reactiveStore
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  admin-web-dev:
    container_name: yukari-admin-web-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-web-build
    command: ["npm", "--prefix", "apps/admin-web", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      API_PROXY_TARGET: http://api-server:3000
    volumes:
      - ../apps/admin-web/src:/repo/apps/admin-web/src
      - ../apps/admin-web/index.html:/repo/apps/admin-web/index.html:ro
      - ../apps/admin-web/vite.config.ts:/repo/apps/admin-web/vite.config.ts:ro
      - ../packages/contracts:/repo/packages/contracts
      - ../packages/web-foundation:/repo/packages/web-foundation
      - ../packages/theme:/repo/packages/theme
      - ../packages/language:/repo/packages/language
      - ../packages/reactiveStore:/repo/packages/reactiveStore
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  legacy_bridge:
  player_agent_state:
  yukari_mysql_data:
  yukari_queue_owner:
