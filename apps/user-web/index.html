<html lang="ja">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0f766e" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yukari" />

    <title>Yukari · 点歌</title>
  </head>
